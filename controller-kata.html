<!doctype html>
<html lang="en" data-build="controller-kata-noodle-svg-v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Product One Noodle Controller Grid</title>
  <link rel="stylesheet" href="./src/controller-kata.css?build=3c8ac5a7e26be8591cbd2484fe8a305e79780c1f82abebfbe6725dd904582ced">
</head>
<body>
  <div id="app">
    <svg id="game" aria-label="Product One controller grid" preserveAspectRatio="none">
      <rect width="100%" height="100%" fill="#071014"></rect>
      <g data-noodle-scene></g>
      <path id="reticle" d="M390 225h20M400 215v20"></path>
    </svg>
    <div id="topHud"><strong>Product One · Noodle SVG</strong><div id="topControls">
      <button id="fsButton" class="top-button" type="button">Expand</button>
      <button id="gyroButton" class="top-button" type="button" hidden>Gyro</button>
      <button id="endTestButton" class="top-button" type="button">End Test</button>
      <span id="status">booting...</span>
    </div></div>
    <div id="hint">Left side moves. Right side looks. Jump. Reach the cyan exit.</div>
    <div id="leftStick"><div></div></div>
    <div id="actionPad"><button id="jumpButton" type="button">Jump</button><button id="attackButton" type="button" hidden>Strike</button></div>
  </div>
  <script type="module" src="./src/controller-kata-runtime.js?build=dad321978041af7a0415c8a86269c5ee4fc28451dcf29bd61933c93d53e991fa"></script>
</body>
</html>
