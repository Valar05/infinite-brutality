<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Product One Controller Grid</title>
  <link rel="stylesheet" href="./src/styles.css?v=0.2.9">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Product One controller grid"></canvas>
    <div id="topHud">
      <strong>Product One Controller Grid</strong>
      <div id="topControls">
        <button id="fsButton" class="top-button" type="button" title="Fullscreen">⛶</button>
        <button id="gyroButton" class="top-button" type="button" title="Gyro">Gyro</button>
        <button id="errorCopyButton" class="top-button error-copy-button" type="button" title="Copy last error" hidden>Copy Error</button>
        <div id="status">booting...</div>
      </div>
    </div>
    <div id="hint">Move with WASD or left touch. Look with mouse or right touch. Jump. Reach the cyan exit.</div>
    <div id="healthHud" aria-label="Player health">
      <div class="health-header">
        <span class="health-label">Vital</span>
        <span id="healthValue">10 / 10</span>
      </div>
      <div id="healthBar">
        <div id="healthBarFill"></div>
      </div>
    </div>
    <div id="damageFlash"></div>
    <div id="attackDebugHud" hidden><pre id="attackDebugText"></pre></div>
    <div id="readout"></div>
    <div id="leftStick" class="stick"><div></div></div>
    <div id="actionPad">
      <button id="jumpButton" type="button">Jump</button>
      <button id="attackButton" type="button">Strike</button>
    </div>
  </div>
  <script type="module" src="./src/main.js?v=0.8.214"></script>
</body>
</html>
